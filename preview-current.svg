<svg xmlns="http://www.w3.org/2000/svg" width="1365" height="900" viewBox="0 0 1365 900">
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23313a"/>
      <stop offset="1" stop-color="#12171d"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6f8fb"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#557041"/>
      <stop offset=".42" stop-color="#236f8f"/>
      <stop offset="1" stop-color="#b94a28"/>
    </linearGradient>
    <linearGradient id="fireBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b94a28"/>
      <stop offset="1" stop-color="#79231d"/>
    </linearGradient>
    <linearGradient id="earthBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#557041"/>
      <stop offset="1" stop-color="#2d4329"/>
    </linearGradient>
    <linearGradient id="waterBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#236f8f"/>
      <stop offset="1" stop-color="#17212b"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0v28" fill="none" stroke="#17212b" stroke-opacity=".045"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <style>
      .title{font:700 28px Montserrat,Arial,sans-serif;fill:#fff8e8}
      .label{font:700 11px Montserrat,Arial,sans-serif;letter-spacing:2px;fill:#fff8e8;opacity:.82}
      .body{font:500 17px Montserrat,Arial,sans-serif;fill:#17212b}
      .small{font:600 13px Montserrat,Arial,sans-serif;fill:#17212b;opacity:.76}
      .headline{font:800 14px Montserrat,Arial,sans-serif;letter-spacing:1px;fill:#fff8e8}
      .chat{font:800 28px Montserrat,Arial,sans-serif;fill:#17212b;text-anchor:middle}
    </style>
  </defs>

  <rect width="1365" height="900" fill="url(#stage)"/>
  <circle cx="230" cy="130" r="180" fill="#b94a28" opacity=".22"/>
  <circle cx="1050" cy="155" r="190" fill="#236f8f" opacity=".28"/>

  <g filter="url(#shadow)">
    <rect x="34" y="38" width="940" height="810" rx="8" fill="url(#paper)" stroke="#fff8e8" stroke-opacity=".25"/>
    <rect x="34" y="38" width="940" height="34" rx="8" fill="url(#header)"/>
    <text x="56" y="61" class="label">FATEX: FOUR ELEMENTS UI</text>
    <text x="812" y="61" class="label">ACTOR SHEET</text>

    <rect x="34" y="72" width="940" height="80" fill="url(#header)"/>
    <rect x="58" y="88" width="54" height="54" rx="6" fill="#fff8e8" opacity=".18"/>
    <rect x="60" y="90" width="50" height="50" rx="4" fill="#ffffff" opacity=".22" stroke="#ffffff" stroke-opacity=".45"/>
    <text x="132" y="114" class="title">Kai of the Western Gate</text>
    <text x="134" y="136" class="label">CHARACTER</text>
    <text x="860" y="114" class="title">3 / 4</text>
    <text x="850" y="136" class="label">FATE POINTS</text>

    <g>
      <rect x="56" y="176" width="492" height="226" fill="#fff8e8" opacity=".25"/>
      <rect x="56" y="176" width="492" height="36" fill="url(#fireBar)"/>
      <image href="assets/elements/fire.png" x="68" y="180" width="28" height="28"/>
      <text x="105" y="199" class="headline">ASPECTS</text>
      <line x1="72" y1="244" x2="526" y2="244" stroke="#17212b" stroke-opacity=".42"/>
      <text x="82" y="236" class="body">Last student of a lost style</text>
      <text x="82" y="262" class="small">High Concept</text>
      <line x1="72" y1="304" x2="526" y2="304" stroke="#17212b" stroke-opacity=".42"/>
      <text x="82" y="296" class="body">Never backs down from a duel</text>
      <text x="82" y="322" class="small">Trouble</text>
      <line x1="72" y1="364" x2="526" y2="364" stroke="#17212b" stroke-opacity=".42"/>
      <text x="82" y="356" class="body">The wind knows my name</text>
      <text x="82" y="382" class="small">Aspect</text>
    </g>

    <g>
      <rect x="572" y="176" width="250" height="226" fill="#fff8e8" opacity=".2"/>
      <rect x="572" y="176" width="250" height="36" fill="url(#earthBar)"/>
      <image href="assets/elements/earth.png" x="584" y="180" width="28" height="28"/>
      <text x="620" y="199" class="headline">CONSEQUENCES</text>
      <line x1="588" y1="244" x2="800" y2="244" stroke="#17212b" stroke-opacity=".42"/>
      <text x="598" y="236" class="body">Singed sleeve</text>
      <text x="598" y="262" class="small">Mild</text>
      <line x1="588" y1="304" x2="800" y2="304" stroke="#17212b" stroke-opacity=".42"/>
      <text x="598" y="296" class="body">Shaken focus</text>
      <text x="598" y="322" class="small">Moderate</text>
    </g>

    <g>
      <rect x="838" y="176" width="112" height="404" fill="#fff8e8" opacity=".16"/>
      <rect x="850" y="192" width="88" height="88" rx="6" fill="#fff" stroke="#17212b" stroke-opacity=".14"/>
      <rect x="850" y="288" width="88" height="88" rx="6" fill="#fff" stroke="#17212b" stroke-opacity=".14"/>
      <rect x="850" y="384" width="88" height="88" rx="6" fill="#fff" stroke="#17212b" stroke-opacity=".14"/>
      <text x="894" y="324" class="small" text-anchor="middle">Actor</text>
      <text x="894" y="346" class="small" text-anchor="middle">token</text>
    </g>

    <g>
      <rect x="56" y="430" width="766" height="42" fill="#fff8e8" opacity=".33"/>
      <text x="174" y="456" class="small" text-anchor="middle">SKILLS</text>
      <text x="438" y="456" class="small" text-anchor="middle">EXTRAS</text>
      <text x="704" y="456" class="small" text-anchor="middle">BIO</text>
      <rect x="56" y="496" width="766" height="36" fill="url(#waterBar)"/>
      <image href="assets/elements/water.png" x="68" y="500" width="28" height="28"/>
      <text x="104" y="520" class="headline">TECHNIQUES</text>
      <line x1="76" y1="572" x2="792" y2="572" stroke="#17212b" stroke-opacity=".42"/>
      <text x="88" y="564" class="body">Athletics +4</text>
      <line x1="76" y1="632" x2="792" y2="632" stroke="#17212b" stroke-opacity=".42"/>
      <text x="88" y="624" class="body">Lore +3</text>
      <line x1="76" y1="692" x2="792" y2="692" stroke="#17212b" stroke-opacity=".42"/>
      <text x="88" y="684" class="body">Fight +3</text>
    </g>

    <g>
      <rect x="838" y="626" width="112" height="196" fill="#fff8e8" opacity=".18"/>
      <rect x="846" y="646" width="96" height="34" fill="url(#earthBar)"/>
      <text x="868" y="668" class="headline">STRESS</text>
      <rect x="852" y="704" width="42" height="42" rx="4" fill="#17212b"/>
      <rect x="904" y="704" width="42" height="42" rx="4" fill="#17212b"/>
      <rect x="852" y="758" width="42" height="42" rx="4" fill="#17212b"/>
      <rect x="904" y="758" width="42" height="42" rx="4" fill="#17212b"/>
      <text x="873" y="731" class="headline" text-anchor="middle">1</text>
      <text x="925" y="731" class="headline" text-anchor="middle">2</text>
      <text x="873" y="785" class="headline" text-anchor="middle">3</text>
      <text x="925" y="785" class="headline" text-anchor="middle">4</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="1010" y="72" width="320" height="330" rx="6" fill="url(#paper)" stroke="#17212b" stroke-opacity=".22"/>
    <rect x="1032" y="96" width="276" height="36" fill="url(#fireBar)"/>
    <image href="assets/elements/fire.png" x="1040" y="100" width="28" height="28"/>
    <text x="1076" y="120" class="headline">FIRE SWEEP</text>
    <text x="1170" y="190" class="chat">+5</text>
    <text x="1170" y="216" class="small" text-anchor="middle">Superb</text>
    <rect x="1098" y="246" width="34" height="34" rx="5" fill="#17212b"/>
    <rect x="1142" y="246" width="34" height="34" rx="5" fill="#17212b"/>
    <rect x="1186" y="246" width="34" height="34" rx="5" fill="#17212b"/>
    <rect x="1230" y="246" width="34" height="34" rx="5" fill="#17212b"/>
    <text x="1115" y="270" class="headline" text-anchor="middle">+</text>
    <text x="1159" y="270" class="headline" text-anchor="middle">0</text>
    <text x="1203" y="270" class="headline" text-anchor="middle">-</text>
    <text x="1247" y="270" class="headline" text-anchor="middle">+</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1010" y="438" width="320" height="260" rx="6" fill="url(#paper)" stroke="#17212b" stroke-opacity=".22"/>
    <text x="1032" y="476" class="body">Element assets in module</text>
    <image href="assets/elements/water.png" x="1036" y="506" width="58" height="58"/>
    <image href="assets/elements/earth.png" x="1108" y="506" width="58" height="58"/>
    <image href="assets/elements/air.png" x="1180" y="506" width="58" height="58"/>
    <image href="assets/elements/fire.png" x="1252" y="506" width="58" height="58"/>
    <text x="1034" y="612" class="small">Uses your supplied PNG symbols.</text>
    <text x="1034" y="636" class="small">White panels, no square background grid.</text>
  </g>
</svg>
