<svg xmlns="http://www.w3.org/2000/svg" width="1365" height="900" viewBox="0 0 1365 900">
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#263238"/>
      <stop offset="1" stop-color="#14191f"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#557041"/>
      <stop offset="0.45" stop-color="#236f8f"/>
      <stop offset="1" stop-color="#b94a28"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8e8"/>
      <stop offset="1" stop-color="#e6d4b5"/>
    </linearGradient>
    <linearGradient id="inkWater" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17212b"/>
      <stop offset="1" stop-color="#236f8f"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b94a28"/>
      <stop offset="1" stop-color="#7d2d22"/>
    </linearGradient>
    <linearGradient id="earth" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#557041"/>
      <stop offset="1" stop-color="#344a31"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#17212b" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <style>
      .title { font: 700 28px Montserrat, Arial, sans-serif; fill: #fff8e8; }
      .label { font: 700 12px Montserrat, Arial, sans-serif; letter-spacing: 2px; text-transform: uppercase; fill: #fff8e8; opacity: 0.85; }
      .body { font: 500 17px Montserrat, Arial, sans-serif; fill: #17212b; }
      .small { font: 600 13px Montserrat, Arial, sans-serif; fill: #17212b; opacity: 0.76; }
      .headline { font: 800 14px Montserrat, Arial, sans-serif; letter-spacing: 1px; fill: #fff8e8; text-transform: uppercase; }
      .chatText { font: 800 24px Montserrat, Arial, sans-serif; fill: #17212b; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1365" height="900" fill="url(#stage)"/>
  <circle cx="255" cy="120" r="180" fill="#b94a28" opacity="0.22"/>
  <circle cx="1040" cy="150" r="190" fill="#236f8f" opacity="0.28"/>

  <g filter="url(#shadow)">
    <rect x="32" y="38" width="940" height="810" rx="8" fill="url(#paper)" stroke="#fff8e8" stroke-opacity="0.24"/>
    <rect x="32" y="38" width="940" height="810" rx="8" fill="url(#grid)"/>
    <rect x="32" y="38" width="940" height="34" rx="8" fill="url(#header)"/>
    <text x="54" y="61" class="label">FateX: Four Elements UI</text>
    <text x="804" y="61" class="label">Actor Sheet</text>

    <rect x="32" y="72" width="940" height="76" fill="url(#header)"/>
    <circle cx="86" cy="110" r="24" fill="#17212b" stroke="#fff8e8" stroke-width="3"/>
    <path d="M72 113 C83 86, 96 132, 109 104" fill="none" stroke="#d8a946" stroke-width="5" stroke-linecap="round"/>
    <text x="128" y="113" class="title">Kai of the Western Gate</text>
    <text x="130" y="134" class="label">Character</text>
    <text x="848" y="109" class="title">3 / 4</text>
    <text x="840" y="133" class="label">Fate Points</text>

    <g>
      <rect x="56" y="172" width="492" height="220" fill="#fff8e8" opacity="0.2"/>
      <rect x="56" y="172" width="492" height="32" fill="url(#fire)"/>
      <text x="76" y="193" class="headline">Aspects</text>
      <line x1="72" y1="236" x2="526" y2="236" stroke="#17212b" stroke-opacity="0.42"/>
      <text x="82" y="228" class="body">Last student of a lost style</text>
      <text x="82" y="253" class="small">High Concept</text>
      <line x1="72" y1="292" x2="526" y2="292" stroke="#17212b" stroke-opacity="0.42"/>
      <text x="82" y="284" class="body">Never backs down from a duel</text>
      <text x="82" y="309" class="small">Trouble</text>
      <line x1="72" y1="348" x2="526" y2="348" stroke="#17212b" stroke-opacity="0.42"/>
      <text x="82" y="340" class="body">The wind knows my name</text>
      <text x="82" y="365" class="small">Aspect</text>
    </g>

    <g>
      <rect x="572" y="172" width="250" height="220" fill="#fff8e8" opacity="0.18"/>
      <rect x="572" y="172" width="250" height="32" fill="url(#earth)"/>
      <text x="592" y="193" class="headline">Consequences</text>
      <line x1="588" y1="236" x2="800" y2="236" stroke="#17212b" stroke-opacity="0.42"/>
      <text x="598" y="228" class="body">Singed sleeve</text>
      <text x="598" y="253" class="small">Mild</text>
      <line x1="588" y1="292" x2="800" y2="292" stroke="#17212b" stroke-opacity="0.42"/>
      <text x="598" y="284" class="body">Shaken focus</text>
      <text x="598" y="309" class="small">Moderate</text>
    </g>

    <g>
      <rect x="846" y="172" width="100" height="100" fill="url(#fire)"/>
      <rect x="846" y="272" width="100" height="100" fill="#d8a946"/>
      <rect x="846" y="372" width="100" height="100" fill="#557041"/>
      <rect x="846" y="472" width="100" height="100" fill="#236f8f"/>
      <rect x="836" y="162" width="120" height="420" fill="none" stroke="#fff8e8" stroke-width="4" stroke-opacity="0.7"/>
      <text x="896" y="620" class="small" text-anchor="middle">artwork panel</text>
    </g>

    <g>
      <rect x="56" y="416" width="766" height="38" fill="#fff8e8" opacity="0.28"/>
      <rect x="56" y="452" width="255" height="5" fill="#b94a28"/>
      <rect x="311" y="452" width="255" height="5" fill="#d8a946"/>
      <rect x="566" y="452" width="256" height="5" fill="#236f8f"/>
      <text x="158" y="440" class="small" text-anchor="middle">SKILLS</text>
      <text x="438" y="440" class="small" text-anchor="middle">EXTRAS</text>
      <text x="704" y="440" class="small" text-anchor="middle">BIO</text>
      <rect x="56" y="486" width="766" height="32" fill="url(#inkWater)"/>
      <text x="76" y="507" class="headline">Techniques</text>
      <line x1="76" y1="558" x2="792" y2="558" stroke="#17212b" stroke-opacity="0.42"/>
      <text x="88" y="550" class="body">Athletics +4</text>
      <line x1="76" y1="614" x2="792" y2="614" stroke="#17212b" stroke-opacity="0.42"/>
      <text x="88" y="606" class="body">Lore +3</text>
      <line x1="76" y1="670" x2="792" y2="670" stroke="#17212b" stroke-opacity="0.42"/>
      <text x="88" y="662" class="body">Fight +3</text>
    </g>

    <g>
      <rect x="846" y="652" width="100" height="32" fill="url(#inkWater)"/>
      <text x="870" y="673" class="headline">Stress</text>
      <rect x="848" y="708" width="42" height="42" rx="4" fill="#17212b"/>
      <rect x="900" y="708" width="42" height="42" rx="4" fill="#17212b"/>
      <rect x="848" y="760" width="42" height="42" rx="4" fill="#17212b"/>
      <rect x="900" y="760" width="42" height="42" rx="4" fill="#17212b"/>
      <text x="869" y="735" class="headline" text-anchor="middle">1</text>
      <text x="921" y="735" class="headline" text-anchor="middle">2</text>
      <text x="869" y="787" class="headline" text-anchor="middle">3</text>
      <text x="921" y="787" class="headline" text-anchor="middle">4</text>
    </g>
  </g>

  <g filter="url(#shadow)">
    <rect x="1010" y="72" width="320" height="330" rx="6" fill="url(#paper)" stroke="#17212b" stroke-opacity="0.22"/>
    <rect x="1032" y="96" width="276" height="34" fill="url(#fire)"/>
    <text x="1052" y="118" class="headline">Fire Sweep</text>
    <text x="1170" y="178" class="chatText">+5</text>
    <text x="1170" y="204" class="small" text-anchor="middle">Superb</text>
    <rect x="1098" y="236" width="34" height="34" rx="5" fill="#17212b"/>
    <rect x="1142" y="236" width="34" height="34" rx="5" fill="#17212b"/>
    <rect x="1186" y="236" width="34" height="34" rx="5" fill="#17212b"/>
    <rect x="1230" y="236" width="34" height="34" rx="5" fill="#17212b"/>
    <text x="1115" y="260" class="headline" text-anchor="middle">+</text>
    <text x="1159" y="260" class="headline" text-anchor="middle">0</text>
    <text x="1203" y="260" class="headline" text-anchor="middle">-</text>
    <text x="1247" y="260" class="headline" text-anchor="middle">+</text>
    <text x="1032" y="320" class="small">Chat cards inherit parchment, ink,</text>
    <text x="1032" y="342" class="small">and elemental headline treatment.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1010" y="438" width="320" height="260" rx="6" fill="url(#paper)" stroke="#17212b" stroke-opacity="0.22"/>
    <text x="1032" y="476" class="body">Palette inside module</text>
    <rect x="1034" y="508" width="48" height="48" rx="4" fill="#b94a28"/>
    <rect x="1094" y="508" width="48" height="48" rx="4" fill="#d8a946"/>
    <rect x="1154" y="508" width="48" height="48" rx="4" fill="#557041"/>
    <rect x="1214" y="508" width="48" height="48" rx="4" fill="#236f8f"/>
    <rect x="1274" y="508" width="32" height="48" rx="4" fill="#17212b"/>
    <text x="1034" y="588" class="small">fire</text>
    <text x="1094" y="588" class="small">air</text>
    <text x="1154" y="588" class="small">earth</text>
    <text x="1214" y="588" class="small">water</text>
    <text x="1034" y="636" class="small">CSS module, no copyrighted show art.</text>
    <text x="1034" y="660" class="small">Works as a visual layer over FateX.</text>
  </g>
</svg>
